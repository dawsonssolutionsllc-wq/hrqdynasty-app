<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HRQ Dynasty Admin</title>
  <link rel="stylesheet" href="/static/admin.css" />
</head>
<body>
  <h1>HRQ Dynasty Admin Panel</h1>
  <section>
    <h2>Engine Controls</h2>
    <button onclick="callEndpoint('/engine/state')">Engine State</button>
    <button onclick="callEndpoint('/humanoid/realism')">Humanoid Realism</button>
    <button onclick="callEndpoint('/humanoid/evolve')">Evolve Humanoid</button>
  </section>
  <section>
    <h2>Output</h2>
    <pre id="output"></pre>
  </section>
  <script>
    async function callEndpoint(path) {
      const out = document.getElementById("output");
      out.textContent = "Loading " + path + "...";
      try {
        const res = await fetch(path);
        const data = await res.json();
        out.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        out.textContent = "Error calling " + path;
      }
    }
  </script>
</body>
</html>
