<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HRQ Humanoid Interface</title>
  <link rel="stylesheet" href="/static/humanoid.css" />
</head>
<body>
  <div class="humanoid-container">
    <div class="humanoid-visual">
      <div class="humanoid-outline">
        <div class="humanoid-core"></div>
      </div>
    </div>

    <div class="humanoid-panel">
      <h2>Humanoid Profile</h2>
      <pre id="profile"></pre>

      <h3>Actions</h3>
      <button onclick="loadRealism()">Load Realism</button>
      <button onclick="evolve()">Evolve</button>

      <h3>Log</h3>
      <pre id="log"></pre>
    </div>
  </div>

  <script src="/static/humanoid.js"></script>
</body>
</html>
